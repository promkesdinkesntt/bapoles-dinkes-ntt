<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -160 380 340" width="100%" height="100%">
  <!-- 1. KOMODO DRAGON (Behind upper right mic) -->
  <!-- Komodo Neck and Head Arching to the Right -->
  <path
    d="M 25 -140
       C 55 -152 105 -146 136 -108
       C 154 -82 162 -52 148 -28
       C 140 -15 125 -10 110 -5
       C 95 0 85 20 70 45
       C 55 70 30 95 10 105
       L -5 85
       C 15 70 35 45 45 20
       C 55 -5 65 -20 60 -45
       C 55 -70 45 -95 25 -120
       Z"
    fill="#2ba89c"
    stroke="#10355c"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Komodo Snout, Mouth & Tongue -->
  <path
    d="M 148 -28 
       C 160 -32 175 -25 178 -18
       C 180 -12 170 -5 158 -2
       L 138 -5"
    fill="#2ba89c"
    stroke="#10355c"
    stroke-width="5"
  />
  <!-- Forked Tongue -->
  <path
    d="M 172 -18 
       L 192 -16 
       L 200 -23 
       M 192 -16 
       L 200 -11"
    fill="none"
    stroke="#10355c"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!-- Komodo Eye & Brow -->
  <ellipse cx="128" cy="-80" rx="7" ry="8" fill="#ffffff" stroke="#10355c" stroke-width="4"/>
  <circle cx="129" cy="-80" r="4" fill="#10355c"/>
  <path d="M 118 -92 Q 130 -97 140 -90" stroke="#10355c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Komodo Nostril -->
  <ellipse cx="152" cy="-45" rx="3.5" ry="5.5" fill="#10355c"/>

  <!-- Medical Plus Cross (+) inside Komodo Neck/Chest -->
  <g transform="translate(92, -35)">
    <!-- White contour -->
    <rect x="-9" y="-23" width="18" height="46" rx="4" fill="#ffffff" stroke="#10355c" stroke-width="4"/>
    <rect x="-23" y="-9" width="46" height="18" rx="4" fill="#ffffff" stroke="#10355c" stroke-width="4"/>
    <!-- Inner teal cross -->
    <rect x="-6" y="-20" width="12" height="40" rx="2" fill="#2ba89c"/>
    <rect x="-20" y="-6" width="40" height="12" rx="2" fill="#2ba89c"/>
  </g>

  <!-- 2. RETRO MICROPHONE (Main Navy Icon) -->
  <!-- U-shaped Microphone Stand Cradle -->
  <path
    d="M -75 5
       C -75 78 75 78 75 5"
    fill="none"
    stroke="#10355c"
    stroke-width="14"
    stroke-linecap="round"
  />
  <!-- Vertical stem & Stand Base -->
  <line x1="0" y1="70" x2="0" y2="120" stroke="#10355c" stroke-width="14" stroke-linecap="round"/>
  <path d="M -50 120 L 50 120" stroke="#10355c" stroke-width="14" stroke-linecap="round"/>

  <!-- Microphone Capsule Body Outer -->
  <rect x="-56" y="-140" width="112" height="175" rx="56" fill="#ffffff" stroke="#10355c" stroke-width="14"/>

  <!-- Horizontal Grille Slits on Left Side -->
  <g fill="#10355c">
    <rect x="-44" y="-65" width="28" height="11" rx="5.5"/>
    <rect x="-44" y="-45" width="28" height="11" rx="5.5"/>
    <rect x="-44" y="-25" width="28" height="11" rx="5.5"/>
    <rect x="-44" y="-5" width="28" height="11" rx="5.5"/>
  </g>

  <!-- Horizontal Grille Slits on Right Side -->
  <g fill="#10355c">
    <rect x="16" y="-65" width="28" height="11" rx="5.5"/>
    <rect x="16" y="-45" width="28" height="11" rx="5.5"/>
    <rect x="16" y="-25" width="28" height="11" rx="5.5"/>
    <rect x="16" y="-5" width="28" height="11" rx="5.5"/>
  </g>

  <!-- Center divider inside mic -->
  <line x1="0" y1="-70" x2="0" y2="15" stroke="#10355c" stroke-width="7" stroke-linecap="round"/>

  <!-- 3. NTT PROVINCIAL SHIELD EMBLEM (Inside Upper Mic Dome) -->
  <g transform="translate(0, -96)">
    <!-- Outer Yellow Shield Border -->
    <path
      d="M -27 -29
         L 27 -29
         L 27 6
         C 27 26 0 38 0 38
         C 0 38 -27 26 -27 6
         Z"
      fill="#eab308"
      stroke="#10355c"
      stroke-width="2.5"
    />
    <!-- Inner Red Shield -->
    <path
      d="M -23 -25
         L 23 -25
         L 23 4
         C 23 22 0 33 0 33
         C 0 33 -23 22 -23 4
         Z"
      fill="#dc2626"
    />
    <!-- Top Ribbon with NTT text -->
    <path d="M -21 -23 L 21 -23 L 19 -16 L -19 -16 Z" fill="#fef08a"/>
    <text x="0" y="-17.5" fill="#991b1b" font-size="3.2" font-weight="900" text-anchor="middle" font-family="sans-serif">NUSA TENGGARA TIMUR</text>

    <!-- Golden Star -->
    <polygon points="0,-12 2.5,-6 8,-6 3.5,-2.5 5.5,3 0,0 -5.5,3 -3.5,-2.5 -8,-6 -2.5,-6" fill="#facc15"/>

    <!-- Golden Banyan Tree & Komodo in yellow -->
    <path d="M -10 4 C -10 -3 10 -3 10 4 C 8 11 -8 11 -10 4 Z" fill="#fde047"/>
    <path d="M -13 13 Q 0 8 13 13" stroke="#facc15" stroke-width="2.5" fill="none"/>

    <!-- "1958" Text inside badge -->
    <text x="0" y="20" fill="#fef08a" font-size="5.5" font-weight="900" text-anchor="middle" font-family="sans-serif">1958</text>
  </g>

  <!-- 4. DYNAMIC CARDIOGRAM / GROWTH CHART ARROW (Across Microphone) -->
  <!-- White outer contour for maximum contrast separation -->
  <path
    d="M -150 45 
       L -60 45 
       L -35 -15 
       L 5 70 
       L 45 -40 
       L 85 30 
       L 130 -35 
       L 190 -75"
    fill="none"
    stroke="#ffffff"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Outer white arrowhead -->
  <polygon
    points="210,-86 168,-86 186,-48"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Main Teal Pulse Line -->
  <path
    d="M -150 45 
       L -60 45 
       L -35 -15 
       L 5 70 
       L 45 -40 
       L 85 30 
       L 130 -35 
       L 190 -75"
    fill="none"
    stroke="#2ba89c"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Teal Arrowhead -->
  <polygon
    points="210,-86 168,-86 186,-48"
    fill="#2ba89c"
    stroke="#2ba89c"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>
